name: Update dividends from maqasa

# Daily scrape of the dividend history for every stock we track. maqasa
# is the single source of truth for dividends — both the per-stock
# history (merged into stocks.json) and the Calendar tab feed
# (dividend-calendar.json, derived right here). The merge step re-runs
# update_prices.py so stocks.json carries the freshest dividends in the
# same commit.
on:
  # 10:30 UTC = 13:30 Kuwait, Sun–Thu — half an hour after the 13:00 KW
  # market close, matching the fundamentals cron. Catches newly-declared
  # dividends within a day of maqasa publishing them.
  schedule:
    - cron: '30 10 * * 0,1,2,3,4'

  # Manual trigger from the Actions tab — also fires the post-run prices
  # re-deploy below, so this is the easy way to push a fresh dividend
  # snapshot on demand.
  workflow_dispatch:

concurrency:
  group: hamoor-data-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install yfinance
        # Needed by the merge step below, not by the scraper itself.
        run: pip install --quiet yfinance

      - name: Run dividend scraper
        run: python3 update_dividends.py

      - name: Rebuild dividend calendar from maqasa
        # Derives output/dividend-calendar.json (the Calendar tab feed)
        # from the freshly-scraped dividends.json: ex-date + amount, with a
        # cum-date derived as the prior trading day. Stdlib only.
        run: python3 update_dividend_calendar.py

      - name: Re-merge dividends into stocks.json
        # update_prices.py's rebuild_stocks_file step reads the freshly
        # written dividends.json and attaches each ticker's array. Running
        # the full price update here too keeps stocks.json self-consistent
        # (latest closes + latest dividends in one commit).
        run: python3 update_prices.py

      - name: Commit updated data (if changed)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the whole output dir: the re-merge step (update_prices.py)
          # also rewrites manifest.json + prices/*.json, and any file left
          # unstaged makes the `git pull --rebase` below abort (exit 128).
          git add output/
          if git diff --cached --quiet; then
            echo "No dividend changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update dividends $(date -u +%FT%TZ)"
            git pull --rebase || { git rebase --abort; exit 1; }
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase Hosting
        # Deploy whenever there's a diff (cron) or whenever a human ran
        # this manually (workflow_dispatch) — same convention as the
        # prices workflow.
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: hamoor-1ee70
          channelId: live
