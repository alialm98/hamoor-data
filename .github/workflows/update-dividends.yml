name: Update dividends from maqasa

# Annual scrape of the historical dividend history for every stock we
# track. The price cron (update-prices.yml) merges the result into
# stocks.json on its next run, so within ~15 minutes of this workflow
# completing the app sees the new dividend data via the existing OTA
# pipeline.
on:
  # April 20th every year — after most Kuwaiti AGMs (March–April) have
  # finalized their full-year dividends and announced them publicly.
  # Tweak if reality drifts.
  schedule:
    - cron: '0 7 20 4 *'

  # Manual trigger from the Actions tab — also fires the post-run prices
  # re-deploy below, so this is the easy way to push a fresh dividend
  # snapshot at any time of year.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install yfinance
        # Needed by the merge step below, not by the scraper itself.
        run: pip install --quiet yfinance

      - name: Run dividend scraper
        run: python3 update_dividends.py

      - name: Re-merge dividends into stocks.json
        # update_prices.py's rebuild_stocks_file step reads the freshly
        # written dividends.json and attaches each ticker's array. Running
        # the full price update here too keeps stocks.json self-consistent
        # (latest closes + latest dividends in one commit).
        run: python3 update_prices.py

      - name: Commit updated data (if changed)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/dividends.json output/stocks.json
          if git diff --cached --quiet; then
            echo "No dividend changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update dividends $(date -u +%FT%TZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase Hosting
        # Deploy whenever there's a diff (cron) or whenever a human ran
        # this manually (workflow_dispatch) — same convention as the
        # prices workflow.
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: hamoor-1ee70
          channelId: live
